name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg,app
          - platform: linux-x86_64
            os: ubuntu-latest
            args: --bundles deb,appimage
          - platform: windows-x86_64
            os: windows-latest
            args: --bundles nsis

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf \
            pkg-config libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-aarch64' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: true
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Open Terminal Agent {0}', github.ref_name) || '' }}
          releaseBody: |
            ### Downloads
            - **Windows (x64):** `*_x64-setup.exe` (first run: click **More info → Run anyway** if SmartScreen prompts)
            - **macOS (Apple Silicon):** `*_aarch64.dmg` (first run: if Gatekeeper blocks, run `xattr -cr "/Applications/Open Terminal Agent.app"`)
            - **Linux (x64):** `*_amd64.deb` or `*_amd64.AppImage`

            In-app signed updates (`latest.json`) are enabled automatically for all platforms.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Upload workflow build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: open-terminal-agent-${{ matrix.platform }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/*/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/*/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/*/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/*/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/*/release/bundle/msi/*.msi
          if-no-files-found: ignore
